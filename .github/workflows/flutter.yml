name: Flutter CI

on:
  push:
    branches: ["**"]
    paths: ["app/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/flutter.yml"]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
